[package]
name = "spotify-spike"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
env_logger = "0.11.11"
getrandom = "0.4.3"
librespot-connect = "0.8"
librespot-core = "0.8"
librespot-metadata = "0.8"
librespot-oauth = "0.8"
librespot-playback = "0.8"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "signal"] }
toml = "1.1.8"
ureq = { version = "3", features = ["json"] }
