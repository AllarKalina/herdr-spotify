[package]
name = "herdr-spotify"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
crossterm = "0.29"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
librespot-connect = "0.8"
librespot-core = "0.8"
librespot-metadata = "0.8"
librespot-oauth = "0.8"
librespot-playback = "0.8"
log = "0.4"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
sha2 = "0.11.0"
