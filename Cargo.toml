[package]
name = "herdr-spotify"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
env_logger = "0.11"
librespot-connect = "0.8"
librespot-core = "0.8"
librespot-metadata = "0.8"
librespot-oauth = "0.8"
librespot-playback = "0.8"
log = "0.4"
rustix = { version = "1", features = ["process"] }
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
